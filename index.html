<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEO DAILY DASHBOARD</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { prompt: ['Prompt', 'sans-serif'] },
          colors: {
            navy: { DEFAULT: '#0B1E36', light: '#162D4A', dark: '#061223' },
            dashGreen:  '#217346',
            dashRed:    '#9E1A1A',
            dashPurple: '#5A2A82',
            dashYellow: '#F39C12',
            dashBg:     '#E9EEF3'
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Prompt', sans-serif;
      background-color: #CBD5E1; /* สีขอบด้านนอก */
      color: #1a1a1a;
      height: 100vh;
      overflow: hidden;
    }

    /* Outer wrapper — มี padding ซ้ายขวาบนล่าง สร้างช่องว่างรอบ dashboard */
    .dash-wrapper {
      height: 100vh;
      display: flex;
      align-items: stretch;
      padding: 10px 200px; /* บนล่าง 10px | ซ้ายขวา 28px */
    }

    /* Card หลัก */
    .dash-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 32px rgba(0,0,0,.18);
      border: 1px solid #94a3b8;
      overflow: hidden;
      min-height: 0;
    }

    /* Main 3-column grid */
    .dash-main {
      flex: 1;
      display: grid;
      grid-template-columns: 4fr 5fr 4fr;
      gap: 8px;
      padding: 8px;
      background: #E9EEF3;
      overflow: hidden;
      min-height: 0;
    }

    /* แต่ละ column scroll ภายในตัวเอง */
    .dash-col {
      display: flex;
      flex-direction: column;
      gap: 17px;
      overflow-y: auto;
      min-height: 0;
    }
    .dash-col::-webkit-scrollbar { width: 3px; }
    .dash-col::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

    /* KPI footer ติดล่างเสมอ */
    .dash-footer {
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      padding: 7px 12px 5px;
      flex-shrink: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.85; transform: scale(1.03); }
    }
    .animate-fade-in    { animation: fadeIn 0.5s ease-out forwards; }
    .animate-pulse-glow { animation: pulseGlow 2s infinite ease-in-out; }
    .progress-bar-fill  { transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }
  </style>

  <script src="data/dashboard-data.js"></script>
</head>
<body>

<div class="dash-wrapper">
  <div class="dash-card animate-fade-in">

    <!-- 1. HEADER -->
    <header id="comp-header"
      class="bg-[#0B1E36] text-white px-4 py-2.5 flex flex-col md:flex-row justify-between items-center gap-2 border-b-4 border-[#061223] flex-shrink-0">
    </header>

    <!-- 2. MAIN GRID -->
    <div class="dash-main">

      <!-- LEFT (3fr) -->
      <div class="dash-col">
        <div data-component="components/cash-liquidity.html"></div>
        <div data-component="components/companies-overview.html"></div>
        <div data-component="components/today-schedule.html"></div>
        <div data-component="components/risk.html"></div>
      </div>

      <!-- MIDDLE (5fr) -->
      <div class="dash-col">
        <div data-component="components/tasks.html" style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
      </div>

      <!-- RIGHT (4fr) -->
      <div class="dash-col">
        <div data-component="components/decisions.html"></div>
        <div data-component="components/appointments.html"></div>
      </div>

    </div>

    <!-- 3. KPI FOOTER -->
    <div class="dash-footer" data-component="components/kpi-footer.html"></div>

  </div>
</div>

<script>
  (function renderHeader() {
    const d = DASHBOARD_DATA;
    document.getElementById('comp-header').innerHTML = `
      <div class="flex items-center gap-3">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-wider">CEO DAILY DASHBOARD</h1>
      </div>
      <div class="text-sky-300 text-xs sm:text-sm font-light text-center">${d.motto}</div>
      <div class="flex items-center gap-2">
        <div class="bg-[#162D4A] px-3 py-1 rounded-md border border-slate-600/50 flex items-center gap-2 text-sm font-semibold">
          <i class="fa-regular fa-calendar-days text-sky-400"></i>
          <span>${d.date}</span>
        </div>
        <a href="weekly-plan.html"
           class="px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-sm font-semibold shadow-sm flex items-center gap-2">
          <i class="fa-solid fa-table-cells"></i> Weekly Plan
        </a>
      </div>`;
  })();

  async function loadComponent(el) {
    const src = el.getAttribute('data-component');
    try {
      const html = await (await fetch(src)).text();
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const scripts = [...tmp.querySelectorAll('script')];
      scripts.forEach(s => s.remove());
      el.innerHTML = tmp.innerHTML;
      // ถ้า placeholder มี style flex ให้ส่งต่อไปยัง child แรก
      const firstChild = el.firstElementChild;
      if (firstChild && el.style.display === 'flex') {
        firstChild.style.flex = '1';
        firstChild.style.minHeight = '0';
      }
      scripts.forEach(s => {
        const ns = document.createElement('script');
        ns.textContent = s.textContent;
        document.body.appendChild(ns);
      });
    } catch(e) {
      el.innerHTML = `<div style="color:#f87171;font-size:11px;padding:6px;">⚠ โหลด ${src} ไม่สำเร็จ</div>`;
    }
  }

  (async () => {
    for (const p of document.querySelectorAll('[data-component]'))
      await loadComponent(p);
  })();
</script>
</body>
</html>
