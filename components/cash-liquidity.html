<!-- ============================================================
     COMPONENT: Cash & Liquidity
     ข้อมูลอ่านจาก DASHBOARD_DATA.cash (data/dashboard-data.js)
     ============================================================ -->
<div id="comp-cash" class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden flex flex-col"></div>

<script>
(function renderCash() {
  const c = DASHBOARD_DATA.cash;
  const fmt = n => n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const statusMap = {
    "ดี":    { cls: "bg-emerald-500 text-white", icon: "fa-check-circle" },
    "ระวัง": { cls: "bg-amber-400 text-slate-900 animate-pulse-glow", icon: "fa-triangle-exclamation" },
    "วิกฤต": { cls: "bg-red-600 text-white animate-pulse-glow", icon: "fa-circle-xmark" }
  };
  const st = statusMap[c.status] || statusMap["ระวัง"];

  document.getElementById('comp-cash').innerHTML = `
    <div class="bg-[#217346] text-white px-3 py-2 font-semibold text-sm flex items-center gap-2">
      <i class="fa-solid fa-wallet"></i>
      <span>CASH &amp; LIQUIDITY</span>
    </div>
    <div class="p-3 text-xs sm:text-sm flex flex-col gap-2.5">
      <div class="flex justify-between items-center pb-1 border-b border-slate-100">
        <span class="text-slate-600 flex items-center gap-1.5">
          <span class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-[10px]">
            <i class="fa-solid fa-money-bill"></i>
          </span>เงินสดคงเหลือ
        </span>
        <span class="font-bold text-emerald-700 text-sm sm:text-base">
          ${fmt(c.current)} <span class="text-xs font-normal text-slate-500">บาท</span>
        </span>
      </div>
      <div class="flex justify-between items-center pb-1 border-b border-slate-100">
        <span class="text-slate-600 flex items-center gap-1.5">
          <span class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-[10px]">
            <i class="fa-solid fa-arrow-trend-up"></i>
          </span>เงินเข้าคาดการณ์ 7 วัน
        </span>
        <span class="font-bold text-emerald-800 text-sm sm:text-base">
          ${fmt(c.inflow7d)} <span class="text-xs font-normal text-slate-500">บาท</span>
        </span>
      </div>
      <div class="flex justify-between items-center pb-1 border-b border-slate-100">
        <span class="text-slate-600 flex items-center gap-1.5">
          <span class="w-5 h-5 rounded-full bg-red-100 text-red-700 flex items-center justify-center text-[10px]">
            <i class="fa-solid fa-arrow-trend-down"></i>
          </span>เงินออกคาดการณ์ 7 วัน
        </span>
        <span class="font-bold text-[#9E1A1A] text-sm sm:text-base">
          ${fmt(c.outflow7d)} <span class="text-xs font-normal text-slate-500">บาท</span>
        </span>
      </div>
      <div class="mt-1 pt-2 flex items-center justify-between">
        <span class="font-semibold text-slate-700">สถานะ:</span>
        <div class="flex items-center gap-2">
          <span class="${st.cls} font-bold px-5 py-1 rounded text-xs shadow-sm">${c.status}</span>
          <i class="fa-solid ${st.icon} text-amber-500 text-lg"></i>
        </div>
      </div>
    </div>
  `;
})();
</script>
