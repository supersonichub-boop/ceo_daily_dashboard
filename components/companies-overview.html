<!-- ============================================================
     COMPONENT: Companies Overview
     ข้อมูลอ่านจาก DASHBOARD_DATA.companies
     ============================================================ -->
<div id="comp-companies" class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden"></div>

<script>
(function renderCompanies() {
  const companies = DASHBOARD_DATA.companies;
  const dotMap = { green: "bg-emerald-500", amber: "bg-amber-400", red: "bg-red-600" };

  const rows = companies.map(c => {
    const dot = dotMap[c.dotColor] || "bg-amber-400";
    const detailLines = c.detail
      ? c.detail.split('\n').map(l => `<div>${l.trim()}</div>`).join('')
      : '';
    return `
      <div class="grid grid-cols-12 items-center mb-3 last:mb-0">
        <div class="col-span-4 flex items-center gap-1.5">
          <span class="bg-slate-900 text-white font-bold text-[9px] p-1 rounded leading-none">${c.tag}</span>
          <div>
            <div class="font-semibold text-slate-800 text-xs">${c.name}</div>
            <div class="text-[9px] text-slate-400 leading-tight">${detailLines}</div>
          </div>
        </div>
        <div class="col-span-6 px-2">
          <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
            <div class="bg-[#0B1E36] h-2.5 rounded-full progress-bar-fill" style="width:${c.progress}%;"></div>
          </div>
        </div>
        <div class="col-span-2 text-right font-bold text-xs flex items-center justify-end gap-1">
          <span>${c.progress}%</span>
          <span class="w-2.5 h-2.5 rounded-full ${dot} inline-block"></span>
        </div>
      </div>`;
  }).join('');

  document.getElementById('comp-companies').innerHTML = `
    <div class="bg-[#0B1E36] text-white px-3 py-2 font-semibold text-sm flex items-center gap-2">
      <i class="fa-solid fa-city"></i>
      <span>COMPANIES OVERVIEW</span>
    </div>
    <div class="p-3 text-xs sm:text-sm">
      <div class="grid grid-cols-12 text-slate-500 font-medium text-[11px] pb-1.5 border-b mb-2">
        <div class="col-span-4">บริษัท</div>
        <div class="col-span-6 text-center">ความคืบหน้าโครงการ</div>
        <div class="col-span-2 text-right">สถานะ</div>
      </div>
      ${rows}
    </div>`;
})();
</script>
