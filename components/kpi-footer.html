<!-- ============================================================
     COMPONENT: KPI Today Footer  (กระชับ — ติดล่างหน้าจอ)
     ============================================================ -->
<div id="comp-kpi"></div>

<script>
(function renderKPI() {
  const k = DASHBOARD_DATA.kpi;
  const c = KPI_CALC;

  const cards = [
    { cfg: k.cashPosition,    pct: c.cashPct  },
    { cfg: k.projectProgress, pct: c.projPct  },
    { cfg: k.collection,      pct: c.collPct  },
    { cfg: k.submission,      pct: c.submPct  },
    { cfg: k.expenseControl,  pct: c.expPct   }
  ];

  const cardHtml = cards.map(({ cfg, pct }) => `
    <div style="background:white;border:1px solid #e2e8f0;border-radius:6px;
                text-align:center;padding:5px 8px;">
      <div style="font-size:9px;font-weight:700;color:#64748b;letter-spacing:.04em;text-transform:uppercase;">
        ${cfg.label}
      </div>
      <div class="${cfg.textColor}" style="font-size:15px;font-weight:800;margin:1px 0;">
        ${pct}%
      </div>
      <div style="background:#f1f5f9;border-radius:9999px;height:5px;overflow:hidden;margin-bottom:3px;">
        <div class="${cfg.barColor} progress-bar-fill"
             style="height:5px;border-radius:9999px;width:${pct}%;"></div>
      </div>
      <div style="font-size:8px;color:#94a3b8;">${cfg.sublabel}</div>
    </div>`).join('');

  document.getElementById('comp-kpi').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:center;">
      <div style="background:#0B1E36;color:white;border-radius:8px;padding:8px;
                  text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <i class="fa-solid fa-chart-pie" style="color:#38bdf8;font-size:16px;margin-bottom:3px;"></i>
        <span style="font-weight:700;font-size:10px;letter-spacing:.06em;">KPI TODAY</span>
      </div>
      ${cardHtml}
    </div>
    <div style="text-align:center;font-size:10px;color:#475569;font-weight:500;
                margin-top:6px;padding-top:6px;border-top:1px solid #e2e8f0;
                display:flex;justify-content:center;gap:12px;">
      <span>💡 โฟกัสสิ่งสำคัญ</span><span>|</span>
      <span>จัดลำดับงาน</span><span>|</span>
      <span>ตัดสินใจไว</span><span>|</span>
      <span>ทำให้สำเร็จ</span>
    </div>`;
})();
</script>
