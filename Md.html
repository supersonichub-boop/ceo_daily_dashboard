<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายการสรุปเงินยืม MD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
    .table-container {
      overflow-x: auto;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
    }
    th { background-color: #1e3a8a; color: white; font-weight: 500; text-align: center; }
    td { text-align: right; }
    td.text-left   { text-align: left; }
    td.text-center { text-align: center; }
    /* กราฟ 2 ช่อง: เขียน CSS เอง (ไม่ใช้ Tailwind) ให้ความกว้างพร้อมก่อน Chart.js วาด */
    .md-charts { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    .md-charts > * { min-width: 0; }
    @media (min-width: 768px) { .md-charts { grid-template-columns: 1fr 1fr; } }
  </style>

  <!-- ข้อมูล: แก้ที่ data/md-loan-data.js อย่างเดียว -->
  <script src="data/md-loan-data.js"></script>
  <script src="components/md-loan/company-table.js"></script>
</head>
<body class="text-gray-800 p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-8">

    <a href="index.html"
       class="inline-flex items-center gap-2 px-4 py-2 bg-[#0B1E36] text-white rounded-xl text-sm font-semibold shadow-sm hover:bg-[#162D4A]">
      ⬅ Dashboard
    </a>

    <div data-component="components/md-loan/header.html"></div>
    <div data-component="components/md-loan/charts.html"></div>
    <div data-component="components/md-loan/summary.html"></div>

    <hr class="border-gray-300 my-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">รายละเอียดตารางเงินยืมแต่ละบริษัท</h2>

    <div data-component="components/md-loan/table-qfc.html"></div>
    <div data-component="components/md-loan/table-nzn.html"></div>

    <!-- SSB & Reserve (คู่กันบนจอใหญ่) -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="min-w-0" data-component="components/md-loan/table-ssb.html"></div>
      <div class="min-w-0" data-component="components/md-loan/table-reserve.html"></div>
    </div>

  </div>

<script>
  // โหลดกล่องแต่ละไฟล์ (แบบเดียวกับ index.html)
  async function loadComponent(el) {
    const src = el.getAttribute('data-component');
    try {
      const html = await (await fetch(src)).text();
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const scripts = [...tmp.querySelectorAll('script')];
      scripts.forEach(s => s.remove());
      el.innerHTML = tmp.innerHTML;
      scripts.forEach(s => {
        const ns = document.createElement('script');
        ns.textContent = s.textContent;
        document.body.appendChild(ns);
      });
    } catch (e) {
      el.innerHTML = `<div style="color:#f87171;font-size:11px;padding:6px;">⚠ โหลด ${src} ไม่สำเร็จ</div>`;
    }
  }

  (async () => {
    for (const p of document.querySelectorAll('[data-component]'))
      await loadComponent(p);
  })();
</script>
</body>
</html>
